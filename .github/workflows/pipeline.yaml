name: Quality Analysis

on:
  push:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'README.md'
      - '.github/workflows/pipeline.yml'
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build:
    name: Quality Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 23
          distribution: 'zulu'
          cache: 'maven'

      - name: Build and Test
        id: maven-build
        run: mvn -B verify

      - name: Sonar Analysis (Forced Bypass)
        if: success() || failure()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=OOP2026_Gruppo41
          -Dsonar.organization=oop2026
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true
          -Dsonar.verbose=true

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Architectural Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: 'false'
